[project]
name = "aura"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "httpx>=0.28",
  "pywebview>=5.4",
  "pystray>=0.19",
  "pillow>=11",
  "pyttsx3>=2.98",
  "piper-tts>=1.3",
  "sounddevice>=0.5",
  "numpy>=2.0",
  "pywin32>=308",
  "faster-whisper>=1.1",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "pymupdf>=1.24",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.3"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: testes lentos com Ollama (py -m pytest -m slow)",
]
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
