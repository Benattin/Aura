<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>AURA — Preview Visual</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    canvas { max-width: 100vw; max-height: 100vh; display: block; }
    .label { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); color: #8a7020; font: 10px/1 "Segoe UI", sans-serif; letter-spacing: 0.4em; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="label">AURA · PREVIEW</div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let t = 0, last = 0;

    function headHalfW(y) {
      const cy = 0.28, dy = (y - cy) / 0.14;
      if (dy < -1 || dy > 1) return 0;
      return 0.105 * Math.sqrt(Math.max(0, 1 - dy * dy));
    }
    function bodyHalfW(y) {
      if (y < 0.4) return headHalfW(y);
      if (y < 0.44) return 0.04 + (y - 0.4) * 1.2;
      if (y < 0.52) return 0.088 + (y - 0.44) * 2.1;
      if (y < 0.58) return 0.256 - (y - 0.52) * 0.3;
      if (y < 0.72) return 0.238 - (y - 0.58) * 0.85;
      return Math.max(0.04, 0.119 - (y - 0.72) * 0.5);
    }
    function halfW(y) { return y < 0.42 ? headHalfW(y) : bodyHalfW(y); }

    function draw(now) {
      const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
      last = now; t += dt;
      const beat = 0.5 + 0.5 * Math.sin(t * 3);
      const dpr = Math.min(devicePixelRatio, 2);
      const w = canvas.clientWidth = innerWidth;
      const h = canvas.clientHeight = innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const cx = w / 2, cy = h * 0.42, sc = Math.min(w, h) * 0.85;
      const tx = x => cx + (x - 0.5) * sc;
      const ty = y => cy + (y - 0.38) * sc;

      const bg = ctx.createRadialGradient(cx, cy - 20, 10, cx, cy, sc * 0.7);
      bg.addColorStop(0, "#0a0c12"); bg.addColorStop(1, "#020203");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

      const cols = 28, rows = 14, mtnBase = 0.58;
      for (let row = 0; row < rows; row++)
        for (let col = 0; col < cols; col++) {
          const fx = col / (cols - 1), fy = row / (rows - 1);
          const height = Math.sin(fx * 5.5 + 0.3) * 0.04 + Math.sin(fx * 11 + 1.2) * 0.02;
          const px = 0.08 + fx * 0.84, py = mtnBase + fy * 0.38 - height * (1 - fy * 0.5);
          ctx.fillStyle = `rgba(212,175,55,${0.04 + fy * 0.1})`;
          ctx.beginPath(); ctx.arc(tx(px), ty(py), 0.8, 0, 6.28); ctx.fill();
        }

      for (let r = 1; r <= 7; r++) {
        ctx.strokeStyle = `rgba(212,175,55,${0.04 + r * 0.012})`;
        ctx.lineWidth = 0.7;
        ctx.beginPath(); ctx.arc(tx(0.5), ty(0.28), 45 + r * 22, 0, 6.28); ctx.stroke();
      }

      const fg = ctx.createRadialGradient(tx(0.5), ty(0.29), 2, tx(0.5), ty(0.31), sc * 0.14);
      fg.addColorStop(0, "rgba(255,180,80,0.85)"); fg.addColorStop(1, "rgba(212,175,55,0)");
      ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(tx(0.5), ty(0.3), sc * 0.13, 0, 6.28); ctx.fill();

      for (let ci = 0; ci < 42; ci++) {
        const y = 0.17 + (ci / 41) * 0.58, hw = halfW(y);
        if (hw < 0.01) continue;
        const isFace = y < 0.42, segs = isFace ? 48 : 36;
        ctx.strokeStyle = isFace ? `rgba(180,220,255,${0.3 * (0.55 + beat * 0.45)})` : `rgba(212,175,55,${0.15})`;
        ctx.lineWidth = isFace ? 0.85 : 0.55;
        ctx.beginPath();
        for (let si = 0; si <= segs; si++) {
          const frac = si / segs, x = 0.5 - hw + frac * hw * 2;
          const wave = Math.sin(frac * Math.PI * 5 + t * 1.2 + ci * 0.15) * 0.012 * Math.sin(frac * Math.PI);
          const px = tx(x + wave), py = ty(y);
          si ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.stroke();
      }

      for (let fi = 0; fi < 18; fi++) {
        const fx = 0.5 + (fi / 17 - 0.5) * 0.18;
        ctx.strokeStyle = fi % 4 === 0 ? `rgba(255,190,90,${0.4 * beat})` : "rgba(212,175,55,0.12)";
        ctx.lineWidth = fi % 4 === 0 ? 1 : 0.5;
        ctx.beginPath(); ctx.moveTo(tx(fx), ty(0.42));
        ctx.quadraticCurveTo(tx(fx + 0.01), ty(0.49), tx(fx), ty(0.56)); ctx.stroke();
      }

      for (let i = 0; i < 220; i++) {
        const a = (i / 220) * 6.28 + t * 0.15;
        const px = 0.5 + Math.cos(a) * 0.11, py = 0.28 + Math.sin(a) * 0.14;
        ctx.fillStyle = `rgba(200,230,255,${0.45 * (0.5 + beat * 0.5)})`;
        ctx.beginPath(); ctx.arc(tx(px), ty(py), 1, 0, 6.28); ctx.fill();
      }

      ctx.globalCompositeOperation = "lighter";
      const bl = ctx.createRadialGradient(tx(0.5), ty(0.3), 0, tx(0.5), ty(0.3), sc * 0.1);
      bl.addColorStop(0, "rgba(255,160,60,0.15)"); bl.addColorStop(1, "rgba(255,160,60,0)");
      ctx.fillStyle = bl; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = "source-over";

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
